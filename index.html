:root{
  color-scheme:light;
  --bg:#ffffff;
  --surface:rgba(255,255,255,.74);
  --text:#1d1b19;
  --text-soft:#5b5650;
  --muted:#9a948b;
  --hair:rgba(29,27,25,.1);
  --hair-2:rgba(29,27,25,.2);
  --gold:#8f6f35;
  --red:#b8402c;
  --blue:#2f5f9e;
  --teal:#2f7f86;
  --rose:#a8517a;
  --danger:#b8402c;
  --abalone-dark:linear-gradient(115deg,#1f4e63 0%,#2f6f73 20%,#4a4390 40%,#1f6d5c 60%,#7a3d6a 80%,#23466f 100%);
  --pearl:linear-gradient(115deg,#f3eee6 0%,#cdeee6 16%,#e9dcf1 32%,#b9dcee 46%,#f8efdc 60%,#d2f0e2 74%,#f0d6e4 88%,#f3eee6 100%);
  --sheen:radial-gradient(120% 160% at 12% 0%,rgba(255,255,255,.75),rgba(255,255,255,0) 46%);
  --brush:"SolmoeKimDaegeon","Nanum Brush Script",serif;
  --serif:"SolmoeKimDaegeon","Song Myung",serif;
  --latin:"Cormorant Garamond","SolmoeKimDaegeon",serif;
  --sans:"SolmoeKimDaegeon","Gowun Batang",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);overflow-x:hidden}
@supports (overflow:clip){html,body{overflow-x:clip}}
body{min-height:100vh;color:var(--text);font-family:var(--sans);font-weight:300;font-synthesis:none;line-height:1.7;letter-spacing:-.005em;-webkit-font-smoothing:antialiased;overflow-x:hidden;background:var(--bg)}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit;letter-spacing:inherit}
input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:1px solid var(--teal);outline-offset:4px}
::selection{background:rgba(205,176,122,.3)}

.home{position:relative;padding-top:calc(min(100vw,1560px) * .5595 * .15)}
.hero{position:absolute;z-index:0;top:calc(min(100vw,1560px) * .5595 * -.1);left:50%;width:min(100vw,1560px);aspect-ratio:1344/752;transform:translateX(-50%);
  background-size:100% auto;background-position:center top;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 6%,#000 94%,transparent 100%),linear-gradient(180deg,transparent 0,#000 13%,#000 87%,transparent 100%);
  -webkit-mask-composite:source-in;
  mask-image:linear-gradient(90deg,transparent 0,#000 6%,#000 94%,transparent 100%),linear-gradient(180deg,transparent 0,#000 13%,#000 87%,transparent 100%);
  mask-composite:intersect}
.home .cal{position:relative;z-index:1;
  background:rgba(255,255,255,.84);-webkit-backdrop-filter:blur(1.5px) saturate(.85);backdrop-filter:blur(1.5px) saturate(.85);
  border:1px solid rgba(29,27,25,.08);box-shadow:0 30px 80px rgba(29,27,25,.1)}
.scene{position:absolute;top:0;left:0;right:0;height:min(58vw,880px);pointer-events:none;z-index:0;opacity:0;transition:opacity .8s ease;
  background-size:min(100vw,1560px) auto;background-position:center 40px;
  -webkit-mask-image:linear-gradient(#000 40%,transparent 100%);mask-image:linear-gradient(#000 40%,transparent 100%)}
body[data-route="sub"] .scene{opacity:.12}

.wrap{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding:0 48px}

/* 헤더 */
.site-header{position:relative;z-index:2;padding:26px 36px 0}
.lang-switch{position:absolute;top:26px;right:36px;display:flex;gap:2px;padding:3px;border:1px solid var(--hair-2);border-radius:999px;background:rgba(255,255,255,.7);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.lang-switch button{padding:5px 14px;border-radius:999px;font-size:13px;color:var(--text-soft);transition:background .2s,color .2s}
.lang-switch button[aria-pressed="true"]{background:var(--text);color:#fff}
.lang-switch button[data-lang="zh"]{font-family:"Noto Serif SC","Songti SC",serif}
body[data-lang="zh"]{--brush:"Ma Shan Zheng","SolmoeKimDaegeon","Kaiti SC","STKaiti",serif;--serif:"Noto Serif SC","Songti SC","SimSun",serif;--sans:"Noto Serif SC","Songti SC","SimSun",serif}
body[data-lang="zh"] .brand h1{letter-spacing:-.02em}
.brand{display:inline-block;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.brand h1{font-family:var(--brush);font-weight:500;font-size:clamp(84px,12vw,140px);letter-spacing:.02em;line-height:1;
  background:var(--abalone-dark);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.cats{display:flex;gap:28px;margin-top:22px}
.cats a{position:relative;font-family:var(--serif);font-size:18px;font-weight:500;letter-spacing:.1em;color:var(--text);padding-bottom:6px;transition:color .25s}
.cats a::after{content:"";position:absolute;left:0;right:.12em;bottom:0;height:1.5px;background:var(--abalone-dark);transform:scaleX(0);transform-origin:left;transition:transform .35s ease}
.cats a:hover::after,.cats a.on::after{transform:scaleX(1)}
.cats a.dim{color:var(--muted)}

main{padding:24px 0 120px}
.fade{animation:fade .5s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.loading,.empty{color:var(--muted);text-align:center;padding:56px 0;font-size:14.5px}
.hint{color:var(--muted);font-size:14px}

/* 달력 */
.cal{max-width:600px;margin:0 auto;padding:36px 40px 30px;border-radius:28px;background:var(--surface);box-shadow:0 30px 80px rgba(29,27,25,.08);
  -webkit-backdrop-filter:blur(26px) saturate(1.2);backdrop-filter:blur(26px) saturate(1.2);border:1px solid var(--hair)}
.cal-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:30px}
.cal-title{display:flex;align-items:flex-end;gap:16px}
.cal-m{font-family:var(--latin);font-weight:300;font-size:84px;line-height:.78;letter-spacing:-.02em}
.cal-sub{display:flex;flex-direction:column;gap:2px;padding-bottom:2px}
.cal-sub span:first-child{font-family:var(--latin);font-size:17px;color:var(--text-soft);letter-spacing:.08em}
.cal-sub span:last-child{font-family:var(--brush);font-size:28px;font-weight:500;letter-spacing:.02em;line-height:1}
.cal-navs{display:flex;gap:8px}
.cal-nav{position:relative;width:42px;height:42px;border-radius:50%;border:1px solid var(--hair-2);transition:border-color .2s,background .2s}
.cal-nav:hover{border-color:var(--text);background:rgba(29,27,25,.05)}
.cal-nav::before{content:"";position:absolute;left:50%;top:50%;width:8px;height:8px;border-top:1px solid var(--text);border-left:1px solid var(--text);transform:translate(-30%,-50%) rotate(-45deg)}
.cal-nav.next::before{transform:translate(-70%,-50%) rotate(135deg)}
.cal-week,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-week{padding-bottom:12px;margin-bottom:10px;border-bottom:1px solid var(--hair)}
.cal-week span{text-align:center;font-size:13.5px;color:var(--muted);letter-spacing:.1em}
.cal-grid{row-gap:4px}
.cal-cell{position:relative;min-height:70px;padding:4px 0 6px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:1px;font-family:var(--latin);font-size:21px;font-weight:400;color:var(--text)}
.cal-cell .num{position:relative;z-index:1;width:38px;height:38px;display:grid;place-items:center;border-radius:50%;line-height:1;transition:background .2s,box-shadow .2s}
.cal-cell:hover .num{box-shadow:inset 0 0 0 1px var(--hair-2)}
.cal-cell.blank{pointer-events:none}
.cal-cell.sun .num{color:var(--red)}
.cal-cell.sat .num{color:var(--blue)}
.cal-cell.hol .num{color:var(--red)}
.cal-tag{font-family:var(--sans);font-weight:500;font-size:12.5px;line-height:1.2;letter-spacing:-.02em;white-space:nowrap;color:var(--gold)}
.cal-tag.hol{color:var(--red)}
.cal-tag.fest{color:var(--teal)}
.cal-cell.past .cal-tag{opacity:.4}
.moon-mark{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.moon-mark.full{background:radial-gradient(circle at 35% 30%,#fff7e0,#f0d88f 60%,#c9a24a);box-shadow:inset 0 0 0 1px rgba(58,51,45,.45)}
.moon-mark.new{box-shadow:inset 0 0 0 1.2px rgba(58,51,45,.6)}
.cal-cell .moon-mark{position:absolute;top:2px;left:calc(50% + 18px);width:9px;height:9px;z-index:2}
.cal-cell.past .moon-mark{opacity:.35}
.cal-lunar{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text-soft);margin:-4px 0 10px}
.cal-legend .moon-mark{width:7px;height:7px}
.cal-cell.past .num{color:#cdc8bf}
.cal-cell.today .num{background:var(--sheen),var(--pearl);color:#15130f;font-weight:600;box-shadow:inset 0 0 0 1px rgba(29,27,25,.2)}
.cal-cell.sel .num{box-shadow:inset 0 0 0 1px var(--text)}
.cal-cell.today.sel .num{box-shadow:0 0 0 3px var(--bg),0 0 0 4px var(--text)}
.dots{display:flex;gap:3px;height:4px;margin-top:3px}
.dot{display:inline-block;width:4px;height:4px;border-radius:50%}
.dot.jeomsa{background:var(--teal)}
.dot.gut{background:var(--rose)}
.dots em{display:none}
.cal-legend{display:flex;gap:18px;justify-content:flex-end;margin-top:18px;font-size:13px;color:var(--muted);letter-spacing:.04em}
.cal-legend span{display:inline-flex;align-items:center;gap:8px}
.cal-legend .dot{width:5px;height:5px}
.cal-legend{flex-wrap:wrap}
.lg{display:inline-block;width:10px;height:2px;border-radius:1px}
.lg.hol{background:var(--red)}
.lg.term{background:var(--gold)}
.cal-specials{display:flex;flex-wrap:wrap;gap:8px;margin:-2px 0 12px}
.sp{display:inline-flex;align-items:baseline;gap:6px;padding:3px 12px;border-radius:999px;font-size:14px;background:rgba(143,111,53,.09);color:var(--gold)}
.sp small{font-size:11px;opacity:.75}
.sp.hol{background:rgba(184,64,44,.08);color:var(--red)}
.sp.fest{background:rgba(47,127,134,.08);color:var(--teal)}
.cal-detail{margin-top:20px;padding-top:20px;border-top:1px solid var(--hair);min-height:48px}
.cal-detail h3{font-family:var(--serif);font-size:16px;font-weight:500;margin-bottom:10px;letter-spacing:.04em}
.cal-detail ul{list-style:none;display:grid;gap:8px}
.cal-detail li{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;font-size:14.5px;color:var(--text-soft)}
.cal-detail .t{font-family:var(--latin);font-size:18px;color:var(--text)}
.cal-detail .st{color:var(--muted);font-size:13px;text-align:right}
.cal-detail .st b{color:var(--text);font-weight:600}

/* 설화공주 메뉴 */
.menu{border-top:1px solid var(--hair);max-width:720px}
.menu-row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px 32px;padding:38px 4px;border-bottom:1px solid var(--hair);transition:padding .35s ease}
.menu-title{font-family:var(--serif);font-weight:500;font-size:clamp(30px,4.4vw,48px);letter-spacing:.04em;line-height:1.25}
.menu-desc{grid-column:1;font-size:14.5px;color:var(--text-soft);letter-spacing:.02em}
.menu-go{grid-column:2;grid-row:1 / span 2;position:relative;width:52px;height:52px;border-radius:50%;border:1px solid var(--hair-2);transition:background .35s,border-color .35s}
.menu-go::before{content:"";position:absolute;left:17px;top:50%;width:17px;height:1px;background:var(--text);transition:background .35s}
.menu-go::after{content:"";position:absolute;left:26px;top:calc(50% - 4px);width:8px;height:8px;border-top:1px solid var(--text);border-right:1px solid var(--text);transform:rotate(45deg);transition:border-color .35s}
.menu-row:hover{padding-left:16px}
.menu-row:hover .menu-title{background:var(--abalone-dark);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.menu-row:hover .menu-go{background:var(--sheen),var(--pearl);border-color:var(--hair-2)}
.menu-row:hover .menu-go::before{background:#15130f}
.menu-row:hover .menu-go::after{border-color:#15130f}

/* 공통 페이지 */
.page{max-width:760px}
.page.wide{max-width:960px}
.back{display:inline-flex;align-items:center;gap:10px;font-size:13.5px;letter-spacing:.06em;color:var(--muted);margin-bottom:22px;transition:color .2s}
.back::before{content:"";width:18px;height:1px;background:currentColor}

/* 저장소: Firebase 또는 미리보기(브라우저 저장) */
async function makeFirebaseStore() {
  const V = "10.12.2";
  const appM = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
  const fs = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
  const au = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`);
  const fbApp = appM.initializeApp(CONFIG.firebase);
  const db = fs.getFirestore(fbApp);
  const auth = au.getAuth(fbApp);
  const editorEmail = CONFIG.editorEmail.trim().toLowerCase();
  return {
    mode: "firebase",
    async list(col, opt = {}) {
      let q = fs.collection(db, col);
      if (opt.where) q = fs.query(q, fs.where(...opt.where));
      const snap = await fs.getDocs(q);
      return snap.docs.map(d => ({ id: d.id, ...d.data() }));
    },
    async get(col, id) {
      const s = await fs.getDoc(fs.doc(db, col, id));
      return s.exists() ? { id: s.id, ...s.data() } : null;
    },
    async add(col, data) { const r = await fs.addDoc(fs.collection(db, col), data); return r.id; },
    async set(col, id, data) { await fs.setDoc(fs.doc(db, col, id), data); },
    async update(col, id, patch) { await fs.updateDoc(fs.doc(db, col, id), patch); },
    async remove(col, id) { await fs.deleteDoc(fs.doc(db, col, id)); },
    async login(code) { await au.signInWithEmailAndPassword(auth, CONFIG.editorEmail.trim(), code); },
    async logout() { await au.signOut(auth); },
    onAuth(cb) { au.onAuthStateChanged(auth, u => cb(!!u && (u.email || "").toLowerCase() === editorEmail)); }
  };
}

function makeLocalStore() {
  const KEY = "ilwolgung-demo";
  const AKEY = "ilwolgung-editor";
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } };
  const save = d => { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch { throw new Error("저장 공간이 부족합니다."); } };
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const listeners = [];
  let editor = false;
  try { editor = sessionStorage.getItem(AKEY) === "1"; } catch {}
  const emit = () => listeners.forEach(f => f(editor));
  return {
    mode: "demo",
    async list(col, opt = {}) {
      let arr = Object.entries(load()[col] || {}).map(([id, v]) => ({ id, ...v }));
      if (opt.where) { const [f, , v] = opt.where; arr = arr.filter(x => x[f] === v); }
      return arr;
    },
    async get(col, id) { const v = (load()[col] || {})[id]; return v ? { id, ...v } : null; },
    async add(col, data) { const d = load(); d[col] = d[col] || {}; const id = uid(); d[col][id] = data; save(d); return id; },
    async set(col, id, data) { const d = load(); d[col] = d[col] || {}; d[col][id] = data; save(d); },
    async update(col, id, patch) { const d = load(); if (d[col] && d[col][id]) { Object.assign(d[col][id], patch); save(d); } },
    async remove(col, id) { const d = load(); if (d[col]) { delete d[col][id]; save(d); } },
    async login(code) {
      if (code !== CONFIG.demoCode) throw new Error("invalid");
      editor = true; try { sessionStorage.setItem(AKEY, "1"); } catch {} emit();
    },
    async logout() { editor = false; try { sessionStorage.removeItem(AKEY); } catch {} emit(); },
    onAuth(cb) { listeners.push(cb); cb(editor); }
  };
}

/* 모달, 토스트 */
function openModal(html, { wide = false } = {}) {
  const root = $("#modalRoot");
  const back = document.createElement("div");
  back.className = "modal-back";
  back.innerHTML = `<div class="modal ${wide ? "wide" : ""}" role="dialog" aria-modal="true"><button class="modal-x" type="button" aria-label="${t("close")}">&times;</button>${html}</div>`;
  root.appendChild(back);
  document.body.style.overflow = "hidden";
  let downOnBack = false;
  const onKey = e => { if (e.key === "Escape") close(); };
  function close() {
    back.remove();
    if (!root.children.length) document.body.style.overflow = "";
    document.removeEventListener("keydown", onKey);
  }
  document.addEventListener("keydown", onKey);
  back.addEventListener("mousedown", e => { downOnBack = e.target === back; });
  back.addEventListener("click", e => { if (e.target === back && downOnBack) close(); });
  back.querySelector(".modal-x").addEventListener("click", close);
  const el = back.querySelector(".modal");
  const first = el.querySelector("input:not([type=hidden]):not([type=radio]), textarea, select");
  if (first && window.matchMedia("(min-width:761px)").matches) setTimeout(() => first.focus(), 50);
  return { el, close };
}

function showNotice(title, text) {
  const { el, close } = openModal(`<div class="notice"><h3 class="modal-title">${esc(title)}</h3><p>${esc(text)}</p><button class="btn primary block" type="button" data-close>${t("ok")}</button></div>`);
  el.querySelector("[data-close]").addEventListener("click", close);
}

let toastTimer;
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

const SPECIAL_RANK = { hol: 0, fest: 1, term: 2 };

async function mountCalendar(el) {
  const entries = await store.list("calendar");
  const resMap = {};
  if (isEditor) (await store.list("reservations")).forEach(r => { resMap[r.id] = r; });
  const byDate = {};
  entries.forEach(e => { (byDate[e.date] = byDate[e.date] || []).push(e); });
  Object.values(byDate).forEach(a => a.sort((x, y) => String(x.time).localeCompare(String(y.time))));
  const today = ymd(new Date());

  function detailHtml(date, list) {
    const [, mm, dd] = date.split("-");
    const sp = specialsOf(date);
    const kindLabel = t("kind");
    const spHtml = sp.length ? `<p class="cal-specials">${sp.map(([n, k]) => `<span class="sp ${k}">${esc(spName(n))}<small>${kindLabel[k]}</small></span>`).join("")}</p>` : "";
    const lu = lunarOf(date);
    const luHtml = lu ? `<p class="cal-lunar"><i class="moon-mark ${lu.kind}"></i>${lu.text} ${lu.name}</p>` : "";
    const head = `<h3>${t("dayHead", Number(mm), Number(dd), t("weekdays")[new Date(date + "T00:00:00").getDay()])}</h3>` + luHtml + spHtml;
    if (!list.length) return head + `<p class="hint">${t("noBooking")}</p>`;
    return head + "<ul>" + list.map(e => {
      const r = resMap[e.reservationId];
      const right = isEditor && r ? `<b>${esc(r.name)}</b> ${esc(r.method || "")}` : t("booked");
      return `<li><span class="t">${esc(e.time)}</span><span>${esc(svcLabel(e.service))}</span><span class="st">${right}</span></li>`;
    }).join("") + "</ul>";
  }

  function paint() {
    const { y, m, sel } = calView;
    const first = new Date(y, m, 1).getDay();
    const days = new Date(y, m + 1, 0).getDate();
    let cells = "";
    for (let i = 0; i < first; i++) cells += '<div class="cal-cell blank"></div>';
    for (let d = 1; d <= days; d++) {
      const key = `${y}-${pad(m + 1)}-${pad(d)}`;
      const list = byDate[key] || [];
      const w = (first + d - 1) % 7;
      const sp = specialsOf(key);
      const isHol = sp.some(x => x[1] === "hol");
      const cls = ["cal-cell", key === today && "today", key < today && "past", key === sel && "sel", w === 0 && "sun", w === 6 && "sat", isHol && "hol"].filter(Boolean).join(" ");
      const lu = lunarOf(key);
      const moon = lu ? `<i class="moon-mark ${lu.kind}" title="${lu.text} ${lu.name}"></i>` : "";
      const tag = sp.length ? `<span class="cal-tag ${sp[0][1]}">${esc(spShort(sp[0][0]))}</span>` : "";
      const dots = list.length
        ? `<span class="dots">${list.slice(0, 3).map(e => `<i class="dot ${esc(e.service)}"></i>`).join("")}${list.length > 3 ? `<em>+${list.length - 3}</em>` : ""}</span>`
        : '<span class="dots"></span>';
      cells += `<button type="button" class="${cls}" data-date="${key}" aria-label="${t("cellLabel", m + 1, d)}${lu ? ", " + lu.text : ""}${sp.length ? ", " + sp.map(x => spName(x[0])).join(", ") : ""}${list.length ? ", " + t("cellCount", list.length) : ""}">${moon}<span class="num">${d}</span>${tag}${dots}</button>`;
    }
    el.innerHTML = `
      <div class="cal-head">
        <div class="cal-title">
          <span class="cal-m">${pad(m + 1)}</span>
          <span class="cal-sub"><span>${y}</span><span>${t("months")[m]}</span></span>
        </div>
        <div class="cal-navs">
          <button type="button" class="cal-nav prev" data-nav="-1" aria-label="${t("prevMonth")}"></button>
          <button type="button" class="cal-nav next" data-nav="1" aria-label="${t("nextMonth")}"></button>
        </div>
      </div>
      <div class="cal-week">${t("weekdays").map(w => `<span>${w}</span>`).join("")}</div>
      <div class="cal-grid">${cells}</div>
      <div class="cal-legend"><span><i class="moon-mark new"></i>${t("lgNew")}</span><span><i class="moon-mark full"></i>${t("lgFull")}</span><span><i class="lg hol"></i>${t("lgHol")}</span><span><i class="lg term"></i>${t("lgTerm")}</span><span><i class="dot jeomsa"></i>${t("lgJeomsa")}</span><span><i class="dot gut"></i>${t("lgGut")}</span></div>
      <div class="cal-detail">${sel ? detailHtml(sel, byDate[sel] || []) : `<p class="hint">${t("calHint")}</p>`}</div>`;
  }

  el.addEventListener("click", e => {
    const nav = e.target.closest("[data-nav]");
    if (nav) {
      calView.m += Number(nav.dataset.nav);
      if (calView.m < 0) { calView.m = 11; calView.y--; }
      if (calView.m > 11) { calView.m = 0; calView.y++; }
      calView.sel = null;
      paint();
      return;
    }
    const cell = e.target.closest("[data-date]");
    if (cell) { calView.sel = calView.sel === cell.dataset.date ? null : cell.dataset.date; paint(); }
  });
  paint();
}

async function renderReviews(key) {
  let list = await store.list("reviews", isEditor ? {} : { where: ["hidden", "==", false] });
  list = list.filter(r => r.service === key).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  const visible = list.filter(r => !r.hidden);
  const avg = visible.length ? (visible.reduce((s, r) => s + (Number(r.rating) || 0), 0) / visible.length) : 0;
  const map = Object.fromEntries(list.map(r => [r.id, r]));
  app.innerHTML = `<section class="page fade">
    <a class="back" href="#/seolhwa/${key}">${esc(svcLabel(key))}</a>
    <div class="page-head">
      <h2>${esc(t("reviewsTitle", svcLabel(key)))}</h2>
      <button type="button" class="btn sm" data-act="write">${t("writeReview")}</button>
    </div>
    ${visible.length ? `<p class="avg"><span class="stars">${stars(avg)}</span><strong>${avg.toFixed(1)}</strong>${t("reviewCount", visible.length)}</p>` : ""}
    <div class="review-list">${list.length ? list.map(reviewCard).join("") : `<p class="empty">${t("noReviews")}</p>`}</div>
  </section>`;
  app.querySelector('[data-act="write"]').addEventListener("click", () => openReview(key, () => renderReviews(key)));
  app.querySelector(".review-list").addEventListener("click", async e => {
    const b = e.target.closest("[data-act]");
    if (!b || !isEditor) return;
    const id = b.closest("[data-id]").dataset.id;
    const r = map[id];
    try {
      if (b.dataset.act === "toggle") {
        await store.update("reviews", id, { hidden: !r.hidden });
        toast(r.hidden ? "후기를 공개했습니다." : "후기를 숨겼습니다.");
      } else if (b.dataset.act === "del") {
        if (!confirm("이 후기를 삭제할까요? 삭제한 후기는 되돌릴 수 없습니다.")) return;
        await store.remove("reviews", id);
        toast("후기를 삭제했습니다.");
      }
      renderReviews(key);
    } catch (ex) { console.error(ex); toast("처리하지 못했습니다. 다시 시도해 주세요."); }
  });
}

function resizeImage(file, max = 800) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * s);
      c.height = Math.round(img.height * s);
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg", 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("image")); };
    img.src = url;
  });
}

let adminTab = "pending";

async function confirmRes(r) {
  const cal = await store.list("calendar");
  if (cal.some(c => c.date === r.date && c.time === r.time) &&
      !confirm("같은 날짜와 시간에 이미 확정된 예약이 있습니다. 그래도 확정할까요?")) return false;
  const calId = await store.add("calendar", { date: r.date, time: r.time, service: r.service, reservationId: r.id });
  await store.update("reservations", r.id, { status: "confirmed", calendarId: calId });
  return true;
}
async function releaseRes(r, status) {
  if (r.calendarId) { try { await store.remove("calendar", r.calendarId); } catch {} }
  await store.update("reservations", r.id, { status, calendarId: null });
}
async function deleteRes(r) {
  if (r.calendarId) { try { await store.remove("calendar", r.calendarId); } catch {} }
  await store.remove("reservations", r.id);
}

    if (!F.date.value) return;
    try {
      await store.update("reservations", r.id, { date: F.date.value, time: F.time.value });
      if (r.calendarId) await store.update("calendar", r.calendarId, { date: F.date.value, time: F.time.value });
      close();
      toast("일정을 변경했습니다.");
      renderAdmin();
    } catch (ex) { console.error(ex); toast("변경하지 못했습니다. 다시 시도해 주세요."); }
  });
}

function resItem(r) {
  let btns = "";
  if (r.status === "pending") btns = `
    <button type="button" class="btn primary sm" data-act="confirm">예약 확정</button>
    <button type="button" class="btn sm ghost" data-act="resched">일정 변경</button>
    <button type="button" class="btn sm ghost" data-act="reject">거절</button>`;
  else if (r.status === "confirmed") btns = `
    <button type="button" class="btn sm ghost" data-act="resched">일정 변경</button>
    <button type="button" class="btn sm ghost" data-act="unconfirm">확정 취소</button>`;
  else btns = `<button type="button" class="btn sm ghost" data-act="restore">대기로 되돌리기</button>`;
  btns += `<button type="button" class="btn sm danger" data-act="rdel">삭제</button>`;
  return `<article class="item" data-id="${esc(r.id)}">
    <div class="item-main">
      <div class="item-top"><span class="tag ${esc(r.service)}">${esc(SERVICES[r.service]?.label || "")}</span><span class="tag line">${esc(r.method || "")}</span>${r.lang === "zh" ? '<span class="tag line">중국어 신청</span>' : ""}</div>
      <h4>${esc(fmtDay(r.date))} ${esc(r.time)}</h4>
      <p><b>${esc(r.name)}</b> <a href="tel:${esc(r.phone)}">${esc(r.phone)}</a>${r.messenger ? ` 메신저 ${esc(r.messenger)}` : ""}</p>
      ${r.memo ? `<p class="memo">${esc(r.memo)}</p>` : ""}
      <p class="meta">신청일 ${fmtDate(r.createdAt)}</p>
    </div>
    <div class="item-act">${btns}</div>
  </article>`;
}

function orderItem(o) {
  return `<article class="item" data-id="${esc(o.id)}">
    <div class="item-main">
      <div class="item-top"><span class="tag ${o.status === "done" ? "line" : "gut"}">${o.status === "done" ? "처리 완료" : "새 주문"}</span><span class="tag line">${esc(o.receive)}</span>${o.lang === "zh" ? '<span class="tag line">중국어 신청</span>' : ""}</div>
      <h4>${esc(o.productName)} ${esc(o.qty)}개</h4>
      <p>합계 ${won((Number(o.price) || 0) * (Number(o.qty) || 0))}</p>
      <p><b>${esc(o.name)}</b> <a href="tel:${esc(o.phone)}">${esc(o.phone)}</a>${o.messenger ? ` 메신저 ${esc(o.messenger)}` : ""}</p>
      ${o.address ? `<p class="memo">${esc(o.address)}</p>` : ""}
      ${o.memo ? `<p class="memo">${esc(o.memo)}</p>` : ""}
      <p class="meta">신청일 ${fmtDate(o.createdAt)}</p>
    </div>
    <div class="item-act">
      ${o.status === "done"
        ? '<button type="button" class="btn sm ghost" data-act="oundo">미처리로 되돌리기</button>'
        : '<button type="button" class="btn primary sm" data-act="odone">처리 완료</button>'}
      <button type="button" class="btn sm danger" data-act="odel">삭제</button>
    </div>
  </article>`;
}

async function renderAdmin() {
  if (!isEditor) { go("#/"); return; }
  const [resv, orders] = await Promise.all([store.list("reservations"), store.list("orders")]);
  const byCreated = (a, b) => (b.createdAt || 0) - (a.createdAt || 0);
  resv.sort(byCreated); orders.sort(byCreated);
  const rmap = Object.fromEntries(resv.map(r => [r.id, r]));
  const cnt = {
    pending: resv.filter(r => r.status === "pending").length,
    orders: orders.filter(o => o.status !== "done").length
  };
  const tabs = [["pending", "신청 대기"], ["confirmed", "확정"], ["rejected", "거절"], ["orders", "부적 주문"], ["reviews", "후기 관리"]];
  let body = "";
  if (["pending", "confirmed", "rejected"].includes(adminTab)) {
    const list = resv.filter(r => r.status === adminTab);
    if (adminTab === "confirmed") list.sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
    body = list.length ? list.map(resItem).join("") : '<p class="empty">해당하는 예약이 없습니다.</p>';
  } else if (adminTab === "orders") {
    body = orders.length ? orders.map(orderItem).join("") : '<p class="empty">접수된 주문이 없습니다.</p>';
  } else {
    body = `<div class="links"><a class="btn" href="#/seolhwa/jeomsa/reviews">점사 후기 관리</a><a class="btn" href="#/seolhwa/gut/reviews">상차림 & 굿 후기 관리</a></div>
      <p class="hint">후기 페이지에서 숨기기와 삭제를 할 수 있습니다. 소개 문구와 부적 상품은 각 페이지에서 바로 편집할 수 있습니다.</p>`;
  }
  app.innerHTML = `<section class="page wide fade">
    <div class="page-head"><h2>관리</h2></div>
    <div class="tabs">${tabs.map(([k, l]) => `<button type="button" class="tab ${adminTab === k ? "on" : ""}" data-tab="${k}">${l}${cnt[k] ? `<em>${cnt[k]}</em>` : ""}</button>`).join("")}</div>
    <div class="admin-list">${body}</div>
  </section>`;
  app.querySelector(".tabs").addEventListener("click", e => {
    const t = e.target.closest("[data-tab]");
    if (!t) return;
    adminTab = t.dataset.tab;
    renderAdmin();
  });
  app.querySelector(".admin-list").addEventListener("click", async e => {
    const b = e.target.closest("[data-act]");
    if (!b) return;
    const id = b.closest("[data-id]").dataset.id;
    const r = rmap[id];
    const act = b.dataset.act;
    try {
      if (act === "resched") return openReschedule(r);
      if (act === "confirm") { if (!(await confirmRes(r))) return; toast("예약을 확정했습니다. 메인 달력에 반영되었습니다."); }
      if (act === "reject") { if (!confirm("이 예약을 거절 처리할까요?")) return; await releaseRes(r, "rejected"); toast("거절 처리했습니다."); }
      if (act === "unconfirm") { if (!confirm("확정을 취소하고 신청 대기로 돌릴까요? 달력에서도 빠집니다.")) return; await releaseRes(r, "pending"); toast("확정을 취소했습니다."); }
      if (act === "restore") { await store.update("reservations", id, { status: "pending" }); toast("신청 대기로 되돌렸습니다."); }
      if (act === "rdel") { if (!confirm("예약 정보를 완전히 삭제할까요? 되돌릴 수 없습니다.")) return; await deleteRes(r); toast("예약을 삭제했습니다."); }
      if (act === "odone") { await store.update("orders", id, { status: "done" }); toast("처리 완료로 표시했습니다."); }
      if (act === "oundo") { await store.update("orders", id, { status: "new" }); toast("미처리로 되돌렸습니다."); }
      if (act === "odel") { if (!confirm("주문 정보를 삭제할까요? 되돌릴 수 없습니다.")) return; await store.remove("orders", id); toast("주문을 삭제했습니다."); }
      renderAdmin();
    } catch (ex) { console.error(ex); toast("처리하지 못했습니다. 다시 시도해 주세요."); }
  });
}

/* 편집자 로그인 (숨김 진입) */
function openLogin() {
  const { el, close } = openModal(`
    <form class="form">
      <h3 class="modal-title">입장 코드</h3>
      <input type="password" name="code" autocomplete="current-password" aria-label="입장 코드">
      <p class="form-err" aria-live="polite"></p>
      <button class="btn primary block" type="submit">확인</button>
    </form>`);
  const f = el.querySelector("form");
  setTimeout(() => f.elements.code.focus(), 50);
  f.addEventListener("submit", async e => {
    e.preventDefault();
    const btn = f.querySelector('[type="submit"]');
    btn.disabled = true;
    try {
      await store.login(f.elements.code.value);
      close();
      toast("편집자 모드로 전환했습니다.");
    } catch (ex) {
      f.querySelector(".form-err").textContent =
        String(ex?.code || "").includes("too-many-requests") ? "시도가 너무 많습니다. 잠시 후 다시 입력해 주세요." : "코드가 올바르지 않습니다.";
      f.elements.code.value = "";
      btn.disabled = false;
    }
  });
}

let taps = [];
$("#brand").addEventListener("click", () => {
  const now = Date.now();
  taps = taps.filter(t => now - t < 3000);
  taps.push(now);
  if (taps.length >= CONFIG.secretTaps) {
    taps = [];
    if (!isEditor) openLogin();
  }
});

$("#logoutBtn").addEventListener("click", async () => {
  await store.logout();
  toast("로그아웃했습니다.");
  if (currentRoute.startsWith("#/admin")) go("#/");
});

/* 라우터 */
const routes = [
  [/^#\/?$/, () => renderHome()],
  [/^#\/seolhwa$/, () => renderSeolhwa()],
  [/^#\/seolhwa\/(jeomsa|gut)$/, m => renderService(m[1])],
  [/^#\/seolhwa\/(jeomsa|gut)\/reviews$/, m => renderReviews(m[1])],
  [/^#\/seolhwa\/shop$/, () => renderShop()],
  [/^#\/yeomhwa$/, () => renderYeomhwa()],
  [/^#\/admin$/, () => renderAdmin()]
];

function updateNav(h) {
  $("#navSeolhwa").classList.toggle("dim", h.startsWith("#/yeomhwa"));
  $("#navYeomhwa").classList.toggle("dim", h.startsWith("#/seolhwa"));
  $("#navSeolhwa").classList.toggle("on", h.startsWith("#/seolhwa"));
  $("#navYeomhwa").classList.toggle("on", h.startsWith("#/yeomhwa"));
}

let lastHash = null;
let currentRoute = (() => { try { return location.hash || "#/"; } catch { return "#/"; } })();
async function router() {
  const h = currentRoute;
  updateNav(h);
  document.body.dataset.route = h === "#/" || h === "#" ? "home" : "sub";
  if (h !== lastHash) window.scrollTo(0, 0);
  lastHash = h;
  app.innerHTML = loadingHtml();
  try {
    for (const [re, fn] of routes) {
      const m = h.match(re);
      if (m) { await fn(m); return; }
    }
    go("#/");
  } catch (e) {
    console.error(e);
    app.innerHTML = `<p class="empty">${t("loadFail")}</p>`;
  }
}

/* 링크 이동을 직접 처리: 미리보기 창처럼 주소 변경이 막힌 환경에서도 화면이 넘어가도록 */
function readHash() {
  try { return location.hash || "#/"; } catch { return currentRoute; }
}
function go(h) {
  if (h === currentRoute) { router(); return; }
  currentRoute = h;
  try { history.pushState(null, "", h); } catch {}
  router();
}
document.addEventListener("click", e => {
  const a = e.target.closest('a[href^="#/"]');
  if (!a || e.defaultPrevented || e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) return;
  e.preventDefault();
  go(a.getAttribute("href"));
});
const syncFromUrl = () => {
  const h = readHash();
  if (h !== currentRoute) { currentRoute = h; router(); }
};
document.querySelectorAll("#langSwitch [data-lang]").forEach(b => b.addEventListener("click", () => {
  if (LANG === b.dataset.lang) return;
  LANG = b.dataset.lang;
  try { localStorage.setItem("ilwolgung-lang", LANG); } catch {}
  applyLangStatic();
  router();
}));
applyLangStatic();
window.addEventListener("popstate", syncFromUrl);
window.addEventListener("hashchange", syncFromUrl);
store.onAuth(v => {
  isEditor = v;
  $("#editorBar").hidden = !v;
  router();
});
</script>
